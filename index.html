<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONO | 全球音乐分发中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --black: #000; --white: #fff; --gray: #121212; --border: #262626; --accent: #fff; }
        body { background: var(--black); color: var(--white); font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .input-dark { background: #111; border: 1px solid #333; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .input-dark:focus { border-color: #fff; }
    </style>
</head>
<body class="pb-20">

    <section id="view-landing" class="view active">
        <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50">
            <h1 class="text-2xl font-black italic tracking-tighter">MONO.</h1>
            <button onclick="showView('view-login')" class="text-sm font-bold border border-white/20 px-4 py-2 rounded-full">登录</button>
        </nav>
        
        <div class="p-6 pt-12 text-center">
            <h2 class="text-5xl font-black leading-none mb-6">让你的声音<br><span class="text-gray-500 italic">在全世界共振</span></h2>
            <p class="text-gray-400 text-sm mb-10 leading-relaxed px-4">中国领先的独立音乐发行中枢。支持全球 150+ 平台，自动 ISRC 生成，支持多人协作分账，支付宝秒级结算。</p>
            <div class="flex flex-col gap-4 px-4">
                <button onclick="showView('view-register')" class="bg-white text-black font-bold py-4 rounded-xl">立即开始发行</button>
                <button class="border border-white/10 py-4 rounded-xl text-sm">查看分发平台清单</button>
            </div>
        </div>

        <div class="mt-20 px-6">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6 text-center">覆盖全球主流平台</h3>
            <div class="grid grid-cols-3 gap-8 opacity-40 grayscale">
                <div class="text-center font-bold italic text-sm">Spotify</div>
                <div class="text-center font-bold italic text-sm">Apple Music</div>
                <div class="text-center font-bold italic text-sm">NetEase</div>
                <div class="text-center font-bold italic text-sm">TikTok</div>
                <div class="text-center font-bold italic text-sm">Tencent</div>
                <div class="text-center font-bold italic text-sm">YouTube</div>
            </div>
        </div>
    </section>

    <section id="view-login" class="view p-8 pt-20">
        <h2 class="text-3xl font-bold mb-2">欢迎回来</h2>
        <p class="text-gray-500 text-sm mb-10">请输入您的音乐人账号</p>
        <div class="space-y-4">
            <input type="email" placeholder="邮箱地址" class="input-dark">
            <input type="password" placeholder="密码" class="input-dark">
            <div class="flex justify-between text-xs text-gray-500">
                <label class="flex items-center gap-2"><input type="checkbox"> 记住我</label>
                <button onclick="showView('view-forgot')">忘记密码？</button>
            </div>
            <button onclick="enterConsole()" class="w-full bg-white text-black font-bold py-4 rounded-xl mt-6">登录</button>
            <p class="text-center text-xs text-gray-500 pt-4">没有账号？<button onclick="showView('view-register')" class="text-white font-bold">立即注册</button></p>
        </div>
    </section>

    <section id="view-register" class="view p-8 pt-20">
        <h2 class="text-3xl font-bold mb-2">加入 MONO</h2>
        <p class="text-gray-500 text-sm mb-10">开启您的全球音乐事业</p>
        <div class="space-y-4">
            <input type="text" placeholder="音乐人/厂牌名称" class="input-dark">
            <input type="email" placeholder="电子邮箱" class="input-dark">
            <input type="password" placeholder="创建密码" class="input-dark">
            <div class="text-[10px] text-gray-600 leading-tight">点击注册即代表您同意我们的《发行协议》与《隐私条款》。</div>
            <button onclick="enterConsole()" class="w-full bg-white text-black font-bold py-4 rounded-xl mt-4">创建账号</button>
            <button onclick="showView('view-login')" class="w-full text-center text-xs text-gray-500 pt-4">返回登录</button>
        </div>
    </section>

    <section id="view-forgot" class="view p-8 pt-20">
        <h2 class="text-3xl font-bold mb-2">重置密码</h2>
        <p class="text-gray-500 text-sm mb-10">我们将向您的邮箱发送重置链接</p>
        <div class="space-y-4">
            <input type="email" placeholder="注册邮箱地址" class="input-dark">
            <button class="w-full bg-white text-black font-bold py-4 rounded-xl">发送重置邮件</button>
            <button onclick="showView('view-login')" class="w-full text-center text-xs text-gray-500 pt-4">返回登录</button>
        </div>
    </section>
