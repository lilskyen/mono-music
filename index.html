<!DOCTYPE html>
<html lang="zh-CN">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #fff; --bg: #000; --card: #0d0d0d; --border: #1f1f1f; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .view { display: none; }
        .view.active { display: block; animation: pageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid var(--border); }
        .nav-active { color: #fff !important; font-weight: bold; }
        ::-webkit-scrollbar { width: 0; }
        input::placeholder { color: #444; }
    </style>
</head>
