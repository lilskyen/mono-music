<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONO Distribution | 全球分发控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --b: #000; --w: #fff; --g: #121212; --border: #262626; }
        body { background: var(--b); color: var(--w); font-family: sans-serif; overflow-x: hidden; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tab-btn.active { color: white; border-bottom: 2px solid white; }
    </style>
</head>
<body class="pb-24">
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-lg border-b border-white/10 p-4 flex justify-between items-center">
        <h1 class="text-xl font-black italic tracking-tighter">MONO.后台</h1>
        <div class="flex gap-4 items-center">
            <span class="text-[10px] bg-white text-black px-2 py-0.5 font-bold rounded">PRO 账户</span>
            <i data-lucide="user" class="w-5 h-5"></i>
        </div>
    </header>

    <main id="view-home" class="view active p-5">
        <section class="mb-8">
            <p class="text-gray-500 text-xs uppercase tracking-widest mb-1">未结算全球版税</p>
            <h2 class="text-4xl font-mono font-bold italic">¥42,850.12</h2>
            <div class="mt-4 flex gap-2">
                <button class="bg-white text-black text-xs font-bold px-4 py-2 rounded-sm">立即提现</button>
                <button class="border border-white/20 text-xs px-4 py-2 rounded-sm">财务报表</button>
            </div>
        </section>
        <div class="grid grid-cols-2 gap-3 mb-8">
            <div class="bg-zinc-900 p-4 border border-white/5 rounded-lg">
                <p class="text-gray-500 text-[10px]">分发渠道</p>
                <p class="text-lg font-bold">156 平台</p>
            </div>
            <div class="bg-zinc-900 p-4 border border-white/5 rounded-lg">
                <p class="text-gray-500 text-[10px]">版权警告</p>
                <p class="text-lg font-bold text-green-500">0 风险</p>
            </div>
        </div>
        <h3 class="text-sm font-bold mb-4 flex items-center gap-2">
            <i data-lucide="activity" class="w-4 h-4"></i> 实时分发状态
        </h3>
        <div class="space-y-3">
            <div class="bg-zinc-900/50 border border-white/5 p-4 rounded-xl">
                <div class="flex justify-between mb-2">
                    <span class="text-sm font-bold">Eternal Summer (Single)</span>
                    <span class="text-[10px] text-yellow-500">分发中 85%</span>
                </div>
                <div class="w-full bg-white/10 h-1 rounded-full overflow-hidden">
                    <div class="bg-white h-full w-[85%]"></div>
                </div>
            </div>
        </div>
    </main>

    <main id="view-dist" class="view p-5">
        <h2 class="text-2xl font-bold mb-6 italic">创建新发行</h2>
        <div class="space-y-6">
            <div class="border-2 border-dashed border-white/10 rounded-2xl p-8 text-center bg-zinc-900/30">
                <i data-lucide="upload-cloud" class="w-10 h-10 mx-auto mb-3 text-gray-500"></i>
                <p class="text-sm font-bold">上传母带文件</p>
                <p class="text-[10px] text-gray-600 mt-1">支持 WAV (24bit/96kHz) / FLAC</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-gray-500 uppercase">歌曲标题</label>
                    <input type="text" class="w-full bg-zinc-900 border border-white/10 p-3 rounded mt-1 outline-none">
                </div>
                <button class="w-full bg-white text-black font-bold py-4 rounded shadow-lg shadow-white/5">推送到全球渠道</button>
            </div>
        </div>
    </main>

    <main id="view-assets" class="view p-5">
        <h2 class="text-2xl font-bold mb-6 italic">版权资产库</h2>
        <div class="p-4 border-b border-white/5 flex justify-between items-center">
            <div>
                <p class="text-sm font-bold">ISRC: CN-E01-26-001</p>
                <p class="text-[10px] text-gray-500">已登记于中国版权保护中心</p>
            </div>
            <i data-lucide="shield-check" class="text-green-500 w-5 h-5"></i>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black/90 backdrop-blur-xl border-t border-white/10 flex justify-around py-4">
        <button onclick="switchTab('view-home')" class="tab-btn flex flex-col items-center gap-1 active">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px]">控制台</span>
        </button>
        <button onclick="switchTab('view-dist')" class="tab-btn flex flex-col items-center gap-1 text-gray-500">
            <i data-lucide="send" class="w
